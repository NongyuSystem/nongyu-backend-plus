name: nongyu

services:
  postgres:
    image: postgres:18-alpine
    container_name: nongyu-postgres
    env_file: .env
    environment:
      POSTGRES_USER: nongyu
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: nongyu
    volumes:
      # Postgres 18+ 要求挂载到 /var/lib/postgresql（不是 /var/lib/postgresql/data），
      # 数据落在子目录，便于将来 pg_upgrade 跨大版本升级。
      - /var/lib/nongyu/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nongyu -d nongyu"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nongyu-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASS}", "--appendonly", "yes"]
    volumes:
      - /var/lib/nongyu/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nongyu-minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: .env
    environment:
      MINIO_ROOT_USER: nongyu
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - /var/lib/nongyu/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: nongyu-backend:latest
    container_name: nongyu-server
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped
