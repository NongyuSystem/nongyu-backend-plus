name: Diagnose Network

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: runner 出口 IP + 对照连通性
        run: |
          echo "=== 出口 IP ==="
          curl -s --max-time 10 https://api.ipify.org; echo
          echo "=== 对照：境外公网（应通）==="
          for h in 1.1.1.1 8.8.8.8 github.com; do
            timeout 8 bash -c "cat < /dev/null > /dev/tcp/$h/443" 2>&1 && echo "  $h:443 通" || echo "  $h:443 不通"
          done
          echo "=== 目标服务器 ==="
          HOST="${{ secrets.SERVER_HOST }}"
          echo "target=$HOST"
          getent hosts "$HOST" || echo "  DNS 解析失败"
          for P in 44400 22 80 443; do
            timeout 12 bash -c "cat < /dev/null > /dev/tcp/$HOST/$P" 2>&1 && echo "  $HOST:$P 通" || echo "  $HOST:$P 不通/超时"
          done
          echo "=== 详细路由/错误 ==="
          curl -v --max-time 12 "http://$HOST:80/" 2>&1 | tail -8 || true
